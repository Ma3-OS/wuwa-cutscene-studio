name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri Desktop Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'WuWa Cutscene Studio v__VERSION__'
          releaseBody: |
            ## WuWa Cutscene Studio Release v__VERSION__
            High-performance Wuthering Waves cinematic cutscene extractor, subtitle studio and video renderer.

            ### Platform
            - Windows 10 / 11 64-bit (`x86_64-pc-windows-msvc`)

            ### Integrity Verification
            Please see attached `SHA256SUMS.txt` for file checksums.
          releaseDraft: false
          prerelease: false


      - name: Generate SHA-256 Checksums
        shell: pwsh
        run: |
          Get-ChildItem -Path "src-tauri/target/release/bundle/" -Recurse -File | Where-Object { $_.Extension -in ".exe", ".msi", ".zip" } | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Out-File -FilePath "SHA256SUMS.txt" -Encoding utf8
          Get-Content "SHA256SUMS.txt"

      - name: Upload SHA-256 Checksum Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
          files: SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

