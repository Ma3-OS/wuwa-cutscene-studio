name: Bug Report
description: Report a reproducible bug or unexpected behavior in WuWa Cutscene Studio
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please ensure you have tested with the latest release and reviewed existing open issues before submitting.
  - type: input
    id: version
    attributes:
      label: Application Version
      description: What version of WuWa Cutscene Studio are you running? (e.g., v1.0.0)
      placeholder: v1.0.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: What version of Windows are you running?
      options:
        - Windows 11 64-bit
        - Windows 10 64-bit
        - Other / VM
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
      placeholder: When attempting to render cutscene M0372 with Thai subtitles...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Specific steps to reproduce the issue.
      value: |
        1. Open '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Application Logs
      description: Paste any error messages from the in-app Log View or terminal output here.
      render: shell
  - type: checkboxes
    id: checkboxes
    attributes:
      label: Verification Checkbox
      options:
        - label: I have verified that this issue is not already reported.
          required: true
        - label: I am not uploading copyrighted game assets or encryption keys in this issue.
          required: true
