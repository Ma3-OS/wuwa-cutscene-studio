[package]
name = "wuwa-cutscene-studio"
version = "1.0.0"
description = "High-performance Wuthering Waves cutscene extractor, subtitle studio & video renderer"
authors = ["Ma3-OS"]
edition = "2024"
default-run = "wuwa-cutscene-studio"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wuwa_cutscene_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.4", features = ["stream", "json", "blocking"] }
tokio = { version = "1.53.1", features = ["full"] }
zip = "8.6.0"
futures = "0.3.33"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"
tauri-plugin-shell = "2.3.5"
open = "5.4.0"
thiserror = "2.0"
sha2 = "0.10"
regex = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false
